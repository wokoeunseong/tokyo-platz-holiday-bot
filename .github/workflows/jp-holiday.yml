name: Japan Holiday Check
on:
  schedule:
    - cron: '0 17 * * *' # 02:00 JST/KST; GitHub may delay scheduled runs.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only (no Slack message)'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: japan-morning-briefing
  cancel-in-progress: false
jobs:
  holiday-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify briefing behavior
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Preview or send morning briefing
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/daily_briefing.py --dry-run
          else
            python scripts/daily_briefing.py
          fi
